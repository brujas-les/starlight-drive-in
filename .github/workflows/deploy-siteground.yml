name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground
  cancel-in-progress: false

env:
  DEPLOY_BASE_PATH: /foodfight
  # Only this folder is synced, so the WordPress files around it are never touched.
  DEPLOY_PATH: www/brujasworldsyndicate.com/public_html/foodfight/
  SSH_PORT: 18765

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SSH_HOST: ${{ secrets.SITEGROUND_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Upload to SiteGround
        env:
          SSH_HOST: ${{ secrets.SITEGROUND_HOST }}
          SSH_USER: ${{ secrets.SITEGROUND_USER }}
        run: |
          rsync -az --delete --exclude=_headers \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            .output/public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
